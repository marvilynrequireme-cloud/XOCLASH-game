
workflows:
  android-workflow:
    name: XO CLASH Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --project-name xoclash_game .

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
